# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, kitty
#bind = $mainMod, Q, exec, kitty
bind = $mainMod SHIFT, A, killactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, E, exec, emacsclient -c -a ''
bind = $mainMod, V, togglefloating, 
bind = $mainMod, D, exec, rofi -show drun
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, F, fullscreen,
bind = $mainMod, L, exec, swaylock

bind = $mainMod, Print, exec, grim -g "$(slurp)"

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, ampersand,  focusworkspaceoncurrentmonitor, 1
bind = $mainMod, eacute,     focusworkspaceoncurrentmonitor, 2
bind = $mainMod, quotedbl,   focusworkspaceoncurrentmonitor, 3
bind = $mainMod, apostrophe, focusworkspaceoncurrentmonitor, 4
bind = $mainMod, parenleft,  focusworkspaceoncurrentmonitor, 5
bind = $mainMod, minus,      focusworkspaceoncurrentmonitor, 6
bind = $mainMod, egrave,     focusworkspaceoncurrentmonitor, 7
bind = $mainMod, underscore, focusworkspaceoncurrentmonitor, 8
bind = $mainMod, ccedilla,   focusworkspaceoncurrentmonitor, 9
bind = $mainMod, agrave,     focusworkspaceoncurrentmonitor, 10

bind = $mainMod, 1,  focusworkspaceoncurrentmonitor, 1
bind = $mainMod, 2,  focusworkspaceoncurrentmonitor, 2
bind = $mainMod, 3,  focusworkspaceoncurrentmonitor, 3
bind = $mainMod, 4,  focusworkspaceoncurrentmonitor, 4
bind = $mainMod, 5,  focusworkspaceoncurrentmonitor, 5
bind = $mainMod, 6,  focusworkspaceoncurrentmonitor, 6
bind = $mainMod, 7,  focusworkspaceoncurrentmonitor, 7
bind = $mainMod, 8,  focusworkspaceoncurrentmonitor, 8
bind = $mainMod, 9,  focusworkspaceoncurrentmonitor, 9
bind = $mainMod, 0,  focusworkspaceoncurrentmonitor, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, ampersand,  movetoworkspace, 1
bind = $mainMod SHIFT, eacute,     movetoworkspace, 2
bind = $mainMod SHIFT, quotedbl,   movetoworkspace, 3
bind = $mainMod SHIFT, apostrophe, movetoworkspace, 4
bind = $mainMod SHIFT, parenleft,  movetoworkspace, 5
bind = $mainMod SHIFT, minus,      movetoworkspace, 6
bind = $mainMod SHIFT, egrave,     movetoworkspace, 7
bind = $mainMod SHIFT, underscore, movetoworkspace, 8
bind = $mainMod SHIFT, ccedilla,   movetoworkspace, 9
bind = $mainMod SHIFT, agrave,     movetoworkspace, 10

bind = $mainMod SHIFT, 1,  movetoworkspace, 1
bind = $mainMod SHIFT, 2,  movetoworkspace, 2
bind = $mainMod SHIFT, 3,  movetoworkspace, 3
bind = $mainMod SHIFT, 4,  movetoworkspace, 4
bind = $mainMod SHIFT, 5,  movetoworkspace, 5
bind = $mainMod SHIFT, 6,  movetoworkspace, 6
bind = $mainMod SHIFT, 7,  movetoworkspace, 7
bind = $mainMod SHIFT, 8,  movetoworkspace, 8
bind = $mainMod SHIFT, 9,  movetoworkspace, 9
bind = $mainMod SHIFT, 0,  movetoworkspace, 10

bind = $mainMod ALT, 1,  focusmonitor, mon:eDP-1
bind = $mainMod ALT, 2,  focusmonitor, mon:HDMI-A-1
bind = $mainMod ALT, ampersand,  focusmonitor, mon:eDP-1
bind = $mainMod ALT, eacute,  focusmonitor, mon:HDMI-A-1

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = , XF86MonBrightnessUp, exec, brillo -A 5
bind = , XF86MonBrightnessDown, exec, brillo -U 5

bind = ,XF86AudioRaiseVolume, exec, ~/utilities/changeVolume.sh 2%+
bind = ,XF86AudioLowerVolume, exec, ~/utilities/changeVolume.sh 2%-
bind = ,XF86AudioMute       , exec, ~/utilities/changeVolume.sh mute